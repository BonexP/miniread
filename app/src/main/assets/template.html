<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* 响应式渲染的 rem 基数：16px × 0.4 = 6.4px。
           系数 0.4 来自旧「固定 980px 布局视口 + 缩放贴合」模型的换算
           （WebView 宽约 391dp ÷ 980px ≈ 0.399），用于保持字号观感与旧版一致。
           ⚠️ 删除本行会让全部 rem 字号整体放大 ~2.5 倍，请勿移除。 */
        html { font-size: 6.4px; }
    </style>

    <style>
        $normalize_css
    </style>

    <style>
        $custom_css
    </style>


    <title></title>

</head>
<body>
    $content
</body>
</html>
